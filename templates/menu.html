<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🍕 Restaurant Menu</h1>

    <div class="nav">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/orders">Orders</a>
        <a href="/analytics">Analytics</a>
    </div>

    {% for item in items %}

    <div class="card">
        <h3>{{ item.name }}</h3>
        <p>Price: ${{ item.price }}</p>
    </div>

    {% endfor %}

</div>

</body>
</html>
